poll_interval: 5
ssh_key: ~/.ssh/gpuctl_key
ssh_user: azureuser

# Model-provider account usage (credits / spend / rate limits)
usage:
  poll_interval_minutes: 30          # Claude + Codex
  azure_poll_interval_minutes: 60    # Cost Management API throttles hard
  bedrock_poll_interval_minutes: 180 # Cost Explorer bills $0.01/request
  codex_auth_path: ~/.codex/auth.json
  # Anthropic has no credit-balance API. Paste the balance from
  # console.anthropic.com → Billing once; the dashboard subtracts measured
  # API spend since that date:
  # anthropic_credits:
  #   remaining: 50000
  #   as_of: 2026-07-08
  # Legacy sponsorship balances have no API — paste from
  # microsoftazuresponsorships.com and update occasionally:
  azure_sponsorship:
    remaining: 151007
    total: 350000
    used: 198993
    as_of: 2026-07-07
    offer_start: 2023-12-20  # offer runs through 2027-12-21
    # Optional auto-refresh: paste the Cookie header from a logged-in
    # microsoftazuresponsorships.com browser session (works until it expires).
    # Or set the AZURE_SPONSORSHIP_COOKIE env var instead.
    # portal_cookie: ".AspNet.Cookies=..."
  azure_subscriptions:
    - name: Sponsorship
      id: dbbf045b-65ab-44aa-80bf-8ae5ddb9f871
      sponsorship: true
    - name: Subscription 1
      id: 800aa0f3-2eb4-47a2-a0a1-7f463a53d1d7
  # AWS has no credit-balance API either. Paste each account's balance from
  # AWS console → Billing → Credits once (credits_remaining/credits_as_of);
  # the dashboard subtracts credits consumed since that date.
  bedrock_profiles:
    - name: stackwise
      profile: default   # stackwise-agent user lacks ce:GetCostAndUsage; default (silen) is the same account
      # $100k grant minus $73,156 consumed within Cost Explorer's 13-month
      # window — consumption predates the window, so this is an UPPER BOUND;
      # correct from AWS console → Billing → Credits
      credits_remaining: 26843
      credits_as_of: 2026-07-08
      credits_total: 100000
    - name: endflow
      profile: endflow
      # $100k grant minus $353 consumed (usage began May 2026, fully measured)
      credits_remaining: 99647
      credits_as_of: 2026-07-08
      credits_total: 100000
